server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: sporthub-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sporthub}}
    username: ${DB_USER:sporthub}
    password: ${DB_PASSWORD:sporthub}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

app:
  jwt:
    secret: ${JWT_SECRET:clave-de-desarrollo-insegura-que-en-produccion-se-sustituye-por-secreto-rotado}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
  security:
    max-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:30}
  seed:
    demo-data: ${DEMO_DATA_SEED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

sporthub:
  mfa:
    challenge-expiration-ms: ${MFA_CHALLENGE_EXPIRATION_MS:300000}
    totp:
      issuer: ${MFA_TOTP_ISSUER:SportHub}
    email:
      enabled: ${MFA_EMAIL_ENABLED:false}
      otp-ttl-seconds: ${MFA_EMAIL_OTP_TTL_SECONDS:300}
      sender: ${MFA_EMAIL_SENDER:no-reply@sporthub.local}

logging:
  level:
    com.sporthub: INFO
    org.hibernate.SQL: WARN

server.error.include-message: never