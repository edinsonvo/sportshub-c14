# Render Blueprint — SportHub (Caso 14). Despliegue en la nube (entorno de pruebas).
#
# Uso:
#   1. Sube el repo a GitLab (Render soporta GitHub, GitLab y Bitbucket).
#   2. Render Dashboard -> New + -> Blueprint -> selecciona este repo y `infra/render/render.yaml`.
#   3. Define el valor de JWT_SECRET (marcado `sync: false`) cuando el panel lo solicite.
#
# Notas de diseño:
#   - La base de datos se publica como variables DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD,
#     que el backend compone en `jdbc:postgresql://host:port/db` (ver application.yml).
#     NO usamos `connectionString` porque Render entrega un DSN `postgres://` no-JDBC.
#   - Las URLs públicas cruzadas se obtienen con `fromService.envVarKey: RENDER_EXTERNAL_URL`
#     (item `property`/`url` no existe para servicios web y `host` es interno, no público).
#     El frontend normaliza `NEXT_PUBLIC_API_URL` para asegurar el sufijo `/api/v1`.
#   - Los planes `free` bastan para pruebas (el web free se suspende por inactividad).

databases:
  - name: sporthub-db
    databaseName: sporthub
    user: sporthub
    plan: free
    region: oregon

services:
  - type: web
    name: sporthub-c14-backend
    runtime: docker
    repo: https://gitlab.com/udea-fe2026-2/sporthub
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: sporthub-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sporthub-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: sporthub-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: sporthub-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sporthub-db
          property: password
      - key: JWT_SECRET
        sync: false # definir en el panel (openssl rand -hex 32)
      - key: DEMO_DATA_SEED
        value: "true"
      - key: JPA_DDL_AUTO
        value: update
      - key: MAX_LOGIN_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCKOUT_MINUTES
        value: "30"
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          name: sporthub-c14-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: sporthub-c14-frontend
    runtime: docker
    repo: https://gitlab.com/udea-fe2026-2/sporthub
    branch: main
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: sporthub-c14-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_DEMO_SERVICE_ID
        value: 8f0a1e2d-3b4c-5d6e-7f80-9a1b2c3d4e5f
